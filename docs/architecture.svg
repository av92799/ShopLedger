<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><style>text{font-family:Arial,sans-serif;fill:#142838}.title{font-size:28px;font-weight:bold}.name{font-size:17px;font-weight:bold}.desc{font-size:12px}.base{fill:#edf3f7;stroke:#98adbd}.t1{fill:#fff0d0;stroke:#c58a16}.t2{fill:#dbf5ed;stroke:#26876c}rect{stroke-width:2} .flow{font-size:15px}</style><rect width="1200" height="800" fill="white"/><text x="40" y="45" class="title">ShopLedger architecture — Tickets 1 and 2</text><text x="40" y="77" font-size="14">Current working tree: earlier fixes retained. Amber = Ticket 1; green = Ticket 2; grey = supporting modules.</text><path d="M600 180V205 M600 270V290 H170 V310 M455 290V310 M740 290V310 M1025 290V310 M170 290H1025" fill="none" stroke="#61788b" stroke-width="2"/><rect x="40" y="115" width="1120" height="65" rx="8" class="base"/><text x="52" y="141" class="name">public/ — index.html · css/style.css · js/app.js</text><text x="52" y="163" class="desc">Browser catalog, POS, order history, Khata and GST audit</text><rect x="40" y="205" width="1120" height="65" rx="8" class="base"/><text x="52" y="231" class="name">server.js</text><text x="52" y="253" class="desc">Static files · JSON body parser · /api routers · /orders/:id/invoice</text><rect x="40" y="310" width="260" height="90" rx="8" class="base"/><text x="52" y="336" class="name">routes/products.js</text><text x="52" y="358" class="desc">Products and coupons</text><rect x="325" y="310" width="260" height="90" rx="8" class="base"/><text x="337" y="336" class="name">routes/orders.js</text><text x="337" y="358" class="desc">Place / list / get / cancel</text><rect x="610" y="310" width="260" height="90" rx="8" class="t2"/><text x="622" y="336" class="name">routes/customers.js</text><text x="622" y="358" class="desc">Accounts and settlements</text><rect x="895" y="310" width="265" height="90" rx="8" class="base"/><text x="907" y="336" class="name">routes/reports.js</text><text x="907" y="358" class="desc">Dashboard / GST / preview / export</text><rect x="40" y="440" width="260" height="65" rx="8" class="base"/><text x="52" y="466" class="name">lib/inventory.js</text><text x="52" y="488" class="desc">find · check · reserve · release</text><rect x="325" y="440" width="260" height="65" rx="8" class="base"/><text x="337" y="466" class="name">lib/pricing.js</text><text x="337" y="488" class="desc">subtotal · computeTotals</text><rect x="610" y="440" width="260" height="65" rx="8" class="t2"/><text x="622" y="466" class="name">lib/ledger.js</text><text x="622" y="488" class="desc">chargeOrderToKhata · recordSettlement</text><rect x="895" y="440" width="265" height="65" rx="8" class="base"/><text x="907" y="466" class="name">lib/reports.js</text><text x="907" y="488" class="desc">Dashboard and GST reconciliation</text><rect x="40" y="525" width="260" height="65" rx="8" class="base"/><text x="52" y="551" class="name">lib/coupons.js</text><text x="52" y="573" class="desc">validate · calculateDiscount</text><rect x="325" y="525" width="260" height="65" rx="8" class="base"/><text x="337" y="551" class="name">lib/tax.js</text><text x="337" y="573" class="desc">getRateForItem · splitCgstSgst</text><rect x="610" y="525" width="260" height="65" rx="8" class="t2"/><text x="622" y="551" class="name">lib/orders.js</text><text x="622" y="573" class="desc">add · get · list [T2] · cancel</text><rect x="895" y="525" width="265" height="65" rx="8" class="t1"/><text x="907" y="551" class="name">lib/invoice.js</text><text x="907" y="573" class="desc">computeInvoiceFigures · render</text><rect x="40" y="610" width="260" height="65" rx="8" class="base"/><text x="52" y="636" class="name">config.js</text><text x="52" y="658" class="desc">Shop · coupons · HSN slabs</text><rect x="325" y="610" width="260" height="65" rx="8" class="t2"/><text x="337" y="636" class="name">lib/dates.js</text><text x="337" y="658" class="desc">today · normalizeDateKey · getFiscalYear</text><rect x="610" y="610" width="260" height="65" rx="8" class="base"/><text x="622" y="636" class="name">lib/store.js</text><text x="622" y="658" class="desc">read · appendAudit · write</text><rect x="895" y="610" width="265" height="65" rx="8" class="base"/><text x="907" y="636" class="name">data/db.json</text><text x="907" y="658" class="desc">Business records and next IDs</text><text x="40" y="714" class="flow">ORDER FLOW: 1 Browser POST /api/orders → 2 server.js → 3 routes/orders.js + store.read()</text><text x="40" y="740" class="flow">4 inventory.find/check → 5 coupons.validate + pricing.computeTotals (coupons + tax)</text><text x="40" y="766" class="flow">6 ledger.chargeOrderToKhata (if credit) → 7 inventory.reserve + orders.add → 8 store.appendAudit/write → 201</text></svg>